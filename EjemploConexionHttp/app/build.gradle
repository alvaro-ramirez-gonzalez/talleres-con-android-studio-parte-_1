plugins { id 'com.android.application' }
android {
    namespace 'johnarrieta.guias.ejemploconexionhttp'
    compileSdk 34
    defaultConfig {
        applicationId "johnarrieta.guias.ejemploconexionhttp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.code.gson:gson:2.10.1'   // reemplaza a gson.jar de la carpeta libs
}
